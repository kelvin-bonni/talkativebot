[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talkativebot"
version = "0.1.0"
description = "A lightweight conversation-state engine inspired by TalkativeBot"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [{name = "TalkativeBot contributors"}]

[tool.setuptools]
packages = ["talkativebot"]